[flake8]
max-line-length = 100
exclude =
    .git,
    __pycache__,
    venv,
    .venv,
    .verify-venv,
    migrations,
    media,
    static
per-file-ignores =
    # Django URL modules and settings often use long imports / unused in __init__
    cinesense/settings.py:E501
    cinesense/urls.py:E501
ignore =
    # Prefer Black/ruff-style flexible wrapping if introduced later
    W503
